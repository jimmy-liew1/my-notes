  publish-tag:
    if: ${{ github.repository == 'jimmy-liew1/my-notes' && github.ref == 'refs/heads/v4' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Get package version
        run: echo "PACKAGE_VERSION=$(node -p \"require('./package.json').version\")" >> "$GITHUB_ENV"

      - name: Create release tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git ls-remote --tags origin "refs/tags/v${PACKAGE_VERSION}" | grep -q "refs/tags/v${PACKAGE_VERSION}"; then
            echo "Tag v${PACKAGE_VERSION} already exists; skipping tag creation."
          else
            git tag -a "v${PACKAGE_VERSION}" -m "Release v${PACKAGE_VERSION}"
            git push origin "v${PACKAGE_VERSION}"
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
